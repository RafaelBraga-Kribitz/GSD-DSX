# A known-bad ANALYSIS-SPEC (REQ-P29-01, REQ-P29-02, REQ-P29-03; ROADMAP Phase 29
# "Evidence case — subgroup harm under a prescriptive recommendation"). Promoted
# from the S5-3 measurement spike (.planning/milestones/v2.6-phases/29-evidence-case-subgroup-harm-
# prescriptive/spike/) into the committed corpus on a confirmed LIVE MISS
# (29-MEASUREMENT.md records `VERDICT: LIVE MISS`; the D-13 measure-first entry
# condition that licenses the mint).
#
# The encoded defect (FROZEN D-29-02, not shaved toward a trivial n/effect — D-13):
# a genuinely PRESCRIPTIVE rollout recommendation on a POSITIVE n-weighted aggregate
# (+3.2pp) that declares four segments, of which minority segment D opposes at
# n=1000, -6.0pp — well above the declared decision.subgroup_harm_floor of 500 —
# with decision.subgroup_harm_floor declared and NO decision.subgroup_harm[]
# disposition row. Given a declared opposing segment above the floor under a
# prescriptive recommendation, that single omission is the SOLE defect. Everything
# else clears the full frame honestly (SRM-balanced observed_n, a fully-reported
# primary test, a time-anchored decision.revisit_when, a checked assumption, a
# structured decision.replay that greenlights the rollout on the positive aggregate).
#
# Construction: a minimal-perturbation clone of a clean causal+experiment control
# (question_type causal -> prescriptive; the claim retyped to prescriptive; four
# segments injected — 3 positive + 1 minority opposing, all n above the floor;
# subgroup_harm_floor declared; subgroup_harm[] omitted). This is the deliberate
# STRUCTURAL OPPOSITE of prescriptive-churn-recommendation (which keeps the question
# descriptive to make a prescriptive CLAIM an overreach → DSX-COH-001): here the
# question is genuinely prescriptive and the claim clears on the merits, so the only
# residual is the undispositioned harm.
#
# Post-mint gate polarity (D-29-00 — the load-bearing INVERSE of Phases 27/28): this
# fixture is a TARGET, not a `kind: miss` sidecar. DSX-COH-041 (minted in plan 29-01
# on the LIVE MISS branch) fires CRITICAL at plan/verify/ship — the `coherence` check
# family is registered at those three points, absent from execute (dsx/cli.py::
# GATE_PROFILES) — so the honestly-declared, undispositioned opposing segment is
# genuinely DETECTED (PRESENT), not merely attributed by an absent code. Measured, not
# predicted; the paired POSTMORTEM.md reproduces the four/five-point gate table.
#
# Sources (D-29-05 honesty — motivating references only, never the enforcement
# mechanic; the check computes nothing on the gate path, D-02):
#   - Gail, M. & Simon, R. (1985), "Testing for qualitative interactions between
#     treatment effects and patient subsets," Biometrics 41(2):361-372, PMID 4027319
#     — the MOTIVATING DEFINITION of a qualitative/crossover interaction (treatment
#     effects of opposite sign across subsets = when a segment counts as harmed).
#     Their paper is a likelihood-ratio TEST; this check runs no such test and does
#     not approximate it — it enforces only the DECLARATION that an opposite-sign,
#     above-floor segment carries a disposition row.
#   - Obermeyer, Z., Powers, B., Vogeli, C. & Mullainathan, S. (2019), "Dissecting
#     racial bias in an algorithm used to manage the health of populations," Science
#     366(6464):447-453, DOI 10.1126/science.aax2342, PMID 31649194 — the real-world
#     MOTIVATION for forcing the disclosure (an aggregate metric that looked effective
#     masked a material harm concentrated in one minority subgroup). Confirmed at
#     abstract + authoritative metadata grade (Crossref + Semantic Scholar); the
#     paper body was not read. Not cited as an enforcement authority.
#
#   dsx validate --spec examples/known-bad/subgroup-harm-without-disposition-ANALYSIS-SPEC.yaml
#   dsx gate plan --spec examples/known-bad/subgroup-harm-without-disposition-ANALYSIS-SPEC.yaml --phase-dir examples/known-bad

spec_version: 1
title: "Should we roll the retention bundle out to all at-risk accounts?"
owner: "r.braga"
created: "2026-09-08"
spec_id: "subgroup-harm-without-disposition"

question_type: prescriptive

decision:
  owner: "VP Customer Success"
  decision_rule: >
    Roll the retention bundle out to 100% of at-risk accounts if the 95% CI lower
    bound on the n-weighted retention uplift exceeds +1.0pp and no guardrail metric
    degrades beyond its declared tolerance. Otherwise hold and iterate.
  action_if_null: "Keep the current retention plan; close the initiative."
  minimum_practical_effect: 0.02
  reversible: true
  deadline: "2026-10-15"
  revisit_when: "retention_lift 95% CI lower bound below +1.0pp at the 2026-Q4 review"
  # D-29-02: subgroup_harm_floor is declared; subgroup_harm[] is DELIBERATELY OMITTED.
  # Segment D opposes at n=1000, well above this 500 floor, with no disposition row.
  subgroup_harm_floor: 500
  replay:
    metric: retention_lift
    ci_lower_min: 0.01
    on_pass: rollout
    on_fail: hold

metrics:
  - name: retention_lift
    type: ratio
    definition: "Difference in 90-day retention rate, treatment minus control"
    grain: account
    numerator: "count(distinct account_id) retained_at_90d"
    denominator: "count(distinct account_id) where at_risk in period"
    timezone: UTC
    source: growth_marts.fct_accounts
    owner: growth-analytics

data:
  - name: accounts
    source: growth_marts.fct_accounts
    period: "2026-07-01..2026-07-14"
    rows: 20000
    snapshot_at: "2026-07-16T03:00:00Z"
    known_gaps: "At-risk flag applied upstream by the standard risk-score filter. No outages in window."

design:
  kind: experiment
  identification: randomized_experiment
  randomization_unit: account
  analysis_unit: account
  variance_adjustment: cluster_robust
  arms: [control, treatment]
  expected_allocation: [0.5, 0.5]
  baseline_rate: 0.60
  mde: 0.02
  alpha: 0.05
  power: 0.80
  planned_n_per_arm: 10000
  duration_days: 14
  guardrail_metrics: [retention_lift]
  peeking_policy: fixed_horizon

analysis:
  outcome_type: proportion
  n_groups: 2
  paired: false
  n_per_group: 10000
  test: two_proportion_z
  normality_ok: true
  equal_variance: true
  independence_ok: true

results:
  observed_n: [10000, 10000]
  interim_looks: 1
  comparisons_looked_at: 1
  overall_effect: 0.032
  segments:
    - name: A
      effect: 0.05
      n: 4000
    - name: B
      effect: 0.04
      n: 3000
    - name: C
      effect: 0.03
      n: 2000
    - name: D
      effect: -0.06
      n: 1000
  tests:
    - metric: retention_lift
      p_value: 0.0002
      effect: 0.032
      standardized_effect: 0.066
      effect_size_kind: h
      ci: [0.024, 0.040]
      interpretation: "The n-weighted uplift clears the practical floor on the aggregate."
      minimum_practical_effect: 0.02

claims:
  - text: >
      Roll the retention bundle out to all at-risk accounts: it raises 90-day
      retention by 3.2 percentage points on the n-weighted aggregate (95% CI 2.4
      to 4.0pp) across the at-risk book in the test window.
    type: prescriptive
    evidence: "examples/known-bad/subgroup-harm-without-disposition-NARRATIVE.md"
    population: "At-risk accounts in the test window (2026-07-01 to 2026-07-14)"
    identification: randomized_experiment

assumptions:
  - assumption: "Bucketing is stable across sessions for a given account_id."
    rationale: "Assignment is hashed on account_id and persisted server-side."
    impact_if_wrong: "Contamination between arms would bias the estimate toward zero."
    checked: true

limitations:
  - "Estimates the effect for at-risk accounts only; says nothing about the healthy base."
  - "Measured over two weeks; seasonal cohorts may respond differently."

reproducibility:
  entrypoint: subgroup-harm-without-disposition-entrypoint.py
  language_version: "python 3.12.10"
  package_versions: "numpy 2.1.0, statsmodels 0.14.2"
  runs_clean_top_to_bottom: true
  repro_lock:
    schema_version: "1"
    stochasticity_declaration: >
      Analysis outputs depend on data extracts and library versions recorded
      elsewhere in this block; this lock documents configuration, not
      byte-identical replay.
    dsx_version: "2.6.1"

narrative:
  path: examples/known-bad/subgroup-harm-without-disposition-NARRATIVE.md
  audience: executive
  lead_claim: 0

validity_frame:
  estimand:
    quantity: "difference in 90-day retention rate"
    type: difference_in_proportions
    population: "at-risk accounts in the test window (2026-07-01 to 2026-07-14)"
    contrast: "retention bundle vs current retention plan"
    time_window: "90 days post-enrolment"
    falsifier: "95% CI on the uplift includes zero, or its lower bound sits below +1.0pp"

  units:
    observation: account
    assignment: account
    analysis: account

  identification:
    strength: strong
    evidence: "Assignment is hashed on account_id and persisted server-side; see design.identification"
    constraint_source: none
    constraint_justification: ""

  dependence:
    structure: clustered
    cluster_var: account_id
    method_family_required: cluster_robust

  interference:
    risk: none
    mechanism: ""
    mitigation: none
    residual_note: ""

  triggering:
    eligible_population: "all at-risk accounts in the test window"
    triggered_definition: "enrolled in the retention bundle"
    analysis_population: eligible
    expected_trigger_rate: 1.0
    dilution_adjusted: true

  stability:
    window: "90 days"
    novelty_primacy_assessed: true
    evidence: "internal readout; the retention gap held flat after week 2"

  sampling_frame:
    source: "growth_marts.fct_accounts, no region filter"
    claim_population: "all at-risk accounts in the test window"
    known_exclusions: ["accounts below the at-risk score threshold"]
    selection_risk: "none identified"

  missingness:
    mechanism: MAR
    rate: 0.0
    method_implied: multiple_imputation

  measurement:
    construct: "account retention"
    operationalisation: "an at-risk account is retained when it renews within 90 days of enrolment"
    known_gaps: "none identified"

inference:
  paradigm: frequentist
  paradigm_justification: team_convention
  declared_at: pre_data
  primary_procedure: two_proportion_z
  alpha_spending: null
  fallback_rule: >
    If any arm's observed n falls below 80% of planned_n_per_arm, extend to the
    pre-declared duration_days ceiling before analysing; do not analyse early.
