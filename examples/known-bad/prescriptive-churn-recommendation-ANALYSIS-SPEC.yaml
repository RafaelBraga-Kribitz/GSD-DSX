# A known-bad ANALYSIS-SPEC (REQ-P11.2-03, ROADMAP Success Criterion 1, D-06).
# The phase's flagship fixture: it is a FULL-SHAPE clone of the good fixture's
# structure — every structurally-required block is present and internally
# clean — so `dsx validate` (which runs only the `spec` structural check,
# dsx/cli.py::cmd_validate, cli.py:245-247) exits 0. What it encodes is a
# semantic defect the structural validator cannot see: a prescriptive
# recommendation smuggled under a descriptive question.
#
# The encoded defect, in three parts:
#   1. question_type is `descriptive` (the weakest rung, coherence.py
#      QUESTION_STRENGTH=0) but claims[0].type is `prescriptive` (the highest
#      rung, CLAIM_STRENGTH=4) — a claim four rungs above the question's
#      ceiling. That is DSX-COH-001's exact trigger
#      (dsx/checks/coherence.py::_check_claim_ceiling).
#   2. decision.decision_rule carries the purpose-gated causal verb `reduce`
#      ("...to reduce churn") under a descriptive question — DSX-COH-010's
#      exact trigger (dsx/checks/coherence.py::_check_decision_language, via
#      the shared dsx/spec.py::causal_verb_matches purpose gate).
#   3. claims[0] is typed prescriptive, uses the same causal verb `reduce`,
#      and declares NO identification behind the intervention it recommends —
#      DSX-CLM-011 (a non-causal-typed claim using causal language,
#      dsx/checks/claims.py::_check_causal_language) and DSX-CLM-020 (a
#      prescriptive claim recommending an intervention with no identification
#      strategy, dsx/checks/claims.py::_check_causal_support).
#
# Deliberately NOT set (so the fixture isolates exactly the REQ-01/02/03
# catches above and mints no unrelated coherence/prereg finding):
#   - design.kind is `observational`, NOT `experiment` — an experiment design
#     would pull in the causal validity_frame sub-blocks (needs_causal_block,
#     dsx/spec.py) and fire DSX-COH-040 (missing revisit trigger,
#     coherence.py::_check_revisit_completeness) and DSX-PRE-040 (missing
#     spec_id, prereg.py::_check_spec_identity).
#   - question_type stays `descriptive`, NOT `prescriptive` — a prescriptive
#     question would likewise fire DSX-COH-040 and DSX-PRE-040 and pull the
#     causal frame sub-blocks in. Keeping the question descriptive is what
#     makes the prescriptive CLAIM the sole overreach, which is the whole
#     point of the fixture.
#
# Expected gate behaviour (measured 2026-08-26 with --phase-dir pointed at a
# fresh tempfile.TemporaryDirectory() per run; never against the shared
# examples/known-bad/DECISIONS.jsonl, whose identity-free floor would trip
# DSX-PRE-041 on a shared root — RESEARCH landmine f):
#   - dsx validate                          exits 0 (structurally valid clone).
#   - dsx gate plan                         exits 1, naming DSX-COH-001 and
#                                           DSX-COH-010 among CRITICAL findings.
#   - dsx gate execute                      exits 0 — `coherence` and `claims`
#                                           are not in the execute gate profile
#                                           (dsx/cli.py::GATE_PROFILES), and the
#                                           clone is clean for ml/code/dq/repro.
#   - dsx gate verify AND ship              exit 1, naming DSX-CLM-011 and
#                                           DSX-CLM-020 among findings.
# See tests/test_known_bad_corpus.py's point-scoped _TARGET_DEFECT_CODES entry
# for this slug, and the paired POSTMORTEM.md for the catch-attribution table.
#
#   dsx validate --spec examples/known-bad/prescriptive-churn-recommendation-ANALYSIS-SPEC.yaml
#   dsx gate plan --spec examples/known-bad/prescriptive-churn-recommendation-ANALYSIS-SPEC.yaml
#
# The suppressions[] entry below grandfathers DSX-PRE-020 only: it lets
# `dsx gate verify`/`ship` run to completion against a fresh phase directory
# with no recorded plan-time header (prereg.py::_check_content_lock would
# otherwise abort at exit 2 before any claim finding is emitted). It suppresses
# nothing else — the four target findings above are untouched.

spec_version: 1
title: "How did quarterly churn move across the enterprise customer segments in FY26?"
owner: "customer-success-analytics"
created: "2026-08-26"

question_type: descriptive

decision:
  owner: "VP Customer Success"
  decision_rule: >
    Offer bundled incentives to the at-risk segment to reduce churn whenever the
    segment's observed quarterly churn sits above 6%. Otherwise hold the current
    plan.
  action_if_null: "Hold the current retention plan; commission a randomized incentive holdout before committing budget."
  minimum_practical_effect: 0.01
  reversible: true
  deadline: "2026-10-01"

metrics:
  - name: quarterly_churn_rate
    type: sum
    definition: "Count of enterprise accounts that lapsed within the fiscal quarter"
    grain: quarter
    source: warehouse.fct_account_churn
    owner: customer-success-analytics

data:
  - name: account_churn
    source: warehouse.fct_account_churn
    period: "2025-07-01..2026-06-30"
    rows: 4820

design:
  kind: observational

claims:
  - text: >
      Offer bundled incentives to reduce churn in the at-risk enterprise
      segment.
    type: prescriptive
    evidence: "RESULTS.md#churn-by-segment"
    population: "enterprise accounts, FY26 (2025-07-01 to 2026-06-30)"

# ── Validity frame (REQ-P6-02) ───────────────────────────────────────────────
# question_type: descriptive and design.kind: observational, so needs_causal_block
# (dsx/spec.py) is False: only the six always-required sub-blocks (estimand,
# units, measurement, dependence, sampling_frame, missingness) are required —
# identification, interference, triggering and stability are deliberately absent,
# which is structurally valid here and keeps the causal frame checks (val's
# DSX-VAL-040 and interference's DSX-INT-*) with nothing to key on. Every sub-block
# present is clean, so this fixture produces no DSX-VAL-* / DSX-SPEC-08* finding.
validity_frame:
  estimand:
    quantity: "quarterly churn rate among enterprise accounts"
    type: difference_in_proportions
    population: "enterprise accounts, FY26 (2025-07-01 to 2026-06-30)"
    contrast: "at-risk segment vs the remaining enterprise base, quarter over quarter"
    time_window: "each fiscal quarter of FY26"
    falsifier: "the quarter-over-quarter churn difference includes zero, or its lower bound sits below +0.5pp"

  units:
    observation: account
    assignment: account
    analysis: account

  dependence:
    structure: clustered
    cluster_var: account_id
    method_family_required: cluster_robust

  sampling_frame:
    source: "warehouse.fct_account_churn, all enterprise accounts"
    claim_population: "enterprise accounts, FY26 (2025-07-01 to 2026-06-30)"
    known_exclusions: []
    selection_risk: "none identified"

  missingness:
    mechanism: MCAR
    rate: 0.0
    method_implied: complete_case

  measurement:
    construct: "account churn"
    operationalisation: "an enterprise account is churned in a quarter when its contract lapses with no renewal within that fiscal quarter, per warehouse.fct_account_churn"
    known_gaps: "none identified"

# ── Inference plan (REQ-P6-04) ───────────────────────────────────────────────
inference:
  paradigm: frequentist
  paradigm_justification: team_convention
  declared_at: pre_data
  primary_procedure: two_proportion_z
  alpha_spending: null
  fallback_rule: >
    If a quarter's churn series has a data-quality break (missing quarter,
    duplicated account, backfilled aggregate), exclude the affected quarter and
    note the exclusion rather than interpolate.

# Grandfathers the prereg content-lock only (see the header note above).
suppressions:
  - code: DSX-PRE-020
    reason: >
      This known-bad fixture demonstrates claim-layer overreach and is gated in
      isolation against a fresh phase directory with no recorded plan-time frame
      lock; the content-lock reconciliation has nothing to reconcile against here
      and is not what this fixture exists to exercise.
    authority: ".planning/phases/11.2-prescriptive-claim-layer/11.2-08-PLAN.md"
