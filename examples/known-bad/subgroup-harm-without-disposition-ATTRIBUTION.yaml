#
# The corpus's FIRST `kind: target` sidecar. Unlike the Phase 27/28 `kind: miss`
# sidecars (whose absent_code is silent live and attributes an uncaught defect), this
# fixture is a TARGET: DSX-COH-041 (minted in plan 29-01, catalogue Total 279) fires
# CRITICAL at plan/verify/ship on the honestly-declared, undispositioned opposing
# segment — a real DETECTED catch (D-29-00, the load-bearing INVERSE of Phases 27/28).
#
