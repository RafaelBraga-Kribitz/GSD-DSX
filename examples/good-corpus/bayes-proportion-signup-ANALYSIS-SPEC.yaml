# Clean control spec — good-side FPR corpus (REQ-P12-03 / D-04).
# Paradigm: bayesian. Outcome shape: binary/proportion.
# Minimal-reference route: references only committed, cwd-resolvable artifacts.

spec_version: 1
title: "Does the streamlined signup form raise account-creation rate?"
owner: "r.braga"
created: "2026-08-02"
spec_id: "bayes-proportion-signup"

question_type: causal

decision:
  owner: "Head of Growth"
  decision_rule: >
    Ship the streamlined form if the posterior probability that the uplift
    exceeds +1.0pp is at least 0.95 and the 95% credible interval lower bound
    clears +1.0pp. Otherwise hold and iterate.
  action_if_null: "Keep the current signup form; reallocate the squad."
  minimum_practical_effect: 0.02
  reversible: true
  deadline: "2026-09-30"
  revisit_when: "creation_rate 95% credible-interval lower bound below +1.0pp at the 2026-Q4 review"
  replay:
    metric: creation_rate
    ci_lower_min: 0.01
    on_pass: ship
    on_fail: hold

metrics:
  - name: creation_rate
    type: ratio
    definition: "Share of signup-form starts that create an account within the session"
    grain: visitor
    numerator: "count(distinct visitor_id) where account_created_at is not null"
    denominator: "count(distinct visitor_id) where form_started_at in period and is_bot = false"
    timezone: UTC
    source: growth_marts.fct_signup_form
    owner: growth-analytics

data:
  - name: form_starts
    source: growth_marts.fct_signup_form
    period: "2026-07-01..2026-07-14"
    rows: 30211
    snapshot_at: "2026-07-16T03:00:00Z"
    known_gaps: "Bot traffic excluded upstream by the standard is_bot filter."

design:
  kind: experiment
  identification: randomized_experiment
  randomization_unit: visitor
  analysis_unit: visitor
  arms: [control, treatment]
  expected_allocation: [0.5, 0.5]
  baseline_rate: 0.36
  mde: 0.02
  alpha: 0.05
  power: 0.80
  planned_n_per_arm: 12000
  duration_days: 14
  guardrail_metrics: [creation_rate]
  peeking_policy: fixed_horizon

analysis:
  # No frequentist test is declared: the inferential procedure is the Bayesian
  # posterior named in inference.primary_procedure. analysis.test is intentionally
  # omitted so the frequentist test-selection contract (DSX-STA-041) does not apply.
  outcome_type: proportion
  n_groups: 2
  paired: false
  n_per_group: 12050
  normality_ok: true
  equal_variance: true
  independence_ok: true

results:
  observed_n: [12050, 12010]
  interim_looks: 1
  comparisons_looked_at: 1
  overall_effect: 0.024
  tests:
    - metric: creation_rate
      effect: 0.024
      standardized_effect: 0.050
      effect_size_kind: h
      ci: [0.013, 0.035]
      posterior_probability: 0.992
      interpretation: "Posterior mass above the +1.0pp floor is 0.99; the credible interval clears it."
      minimum_practical_effect: 0.02

claims:
  - text: >
      The streamlined signup form raises account creation by 2.4 percentage
      points (credible interval 1.3 to 3.5pp) among non-bot visitors in
      the test window.
    type: causal
    evidence: "examples/good-corpus/bayes-proportion-signup-NARRATIVE.md"
    population: "Non-bot signup-form visitors, 2026-07-01 to 2026-07-14"
    identification: randomized_experiment

assumptions:
  - assumption: "Assignment is stable across sessions for a given visitor_id."
    rationale: "Bucketing is hashed on visitor_id and persisted server-side."
    impact_if_wrong: "Cross-arm contamination would bias the posterior toward the null."
    checked: true

limitations:
  - "Estimates the effect for new visitors only; says nothing about returning users."
  - "Measured over two weeks; the posterior is conditional on the priors declared below."

reproducibility:
  entrypoint: examples/good-corpus/_control_readout.py
  random_seed: 42
  language_version: "python 3.12.10"
  package_versions: "numpy 2.1.0, pymc 5.16.2"
  runs_clean_top_to_bottom: true
  repro_lock:
    schema_version: "1"
    stochasticity_declaration: >
      Posterior draws depend on the random seed and library versions recorded
      here; this lock documents configuration, not byte-identical replay.
    dsx_version: "2.0.0"

narrative:
  path: examples/good-corpus/bayes-proportion-signup-NARRATIVE.md
  audience: executive
  lead_claim: 0

validity_frame:
  estimand:
    quantity: "difference in account-creation rate"
    type: difference_in_proportions
    population: "non-bot signup-form visitors, 2026-07-01 to 2026-07-14"
    contrast: "streamlined form vs current form"
    time_window: "within-session"
    falsifier: "95% credible interval on the uplift includes zero, or its lower bound sits below +1.0pp"

  units:
    observation: visitor
    assignment: visitor
    analysis: visitor

  identification:
    strength: strong
    evidence: "Assignment is hashed on visitor_id and persisted server-side; see design.identification"
    constraint_source: none
    constraint_justification: ""

  dependence:
    structure: none
    cluster_var: ""

  interference:
    risk: none
    mechanism: ""
    mitigation: none
    residual_note: ""

  triggering:
    eligible_population: "all signup-form starts in the test window"
    triggered_definition: "started the signup form"
    analysis_population: eligible
    expected_trigger_rate: 1.0
    dilution_adjusted: true

  stability:
    window: "14 days"
    novelty_primacy_assessed: true
    evidence: "internal readout; the creation-rate gap held flat after day 3"

  sampling_frame:
    source: "growth_marts.fct_signup_form, no region filter"
    claim_population: "all signup-form starts in the test window"
    known_exclusions: ["bot-flagged traffic"]
    selection_risk: "none identified"

  missingness:
    mechanism: MAR
    rate: 0.0
    method_implied: multiple_imputation

  measurement:
    construct: "account creation"
    operationalisation: "account created within the session that started the form"
    known_gaps: "none identified"

inference:
  paradigm: bayesian
  paradigm_justification: small_sample_informative_prior
  prior_justification: >
    Weakly-informative Beta(2,5) priors per arm, centred on the historical base
    rate; sensitivity to a flat Beta(1,1) alternative was checked and did not
    move the decision.
  threshold_calibration: >
    The P(uplift > +1.0pp) >= 0.95 rule was fixed before data collection and
    calibrated against the +1.0pp practical floor.
  declared_at: pre_data
  primary_procedure: beta_binomial_posterior
  decision_threshold: 0.95
  fallback_rule: >
    If either arm's observed n falls below 80% of planned_n_per_arm, extend to
    the pre-declared duration_days ceiling before summarising the posterior.
