# Clean control spec — good-side FPR corpus (REQ-P12-03 / D-04).
# Paradigm: bayesian. Outcome shape: continuous.

spec_version: 1
title: "Does the redesigned support flow raise the post-contact satisfaction score?"
owner: "r.braga"
created: "2026-08-11"
spec_id: "bayes-continuous-nps"

question_type: causal

decision:
  owner: "Head of Support"
  decision_rule: >
    Ship the redesigned flow if the posterior probability that the satisfaction
    score rises by more than +2 points is at least 0.95 and the credible-interval
    lower bound clears +2. Otherwise hold and iterate.
  action_if_null: "Keep the current support flow; close the initiative."
  minimum_practical_effect: 2.0
  reversible: true
  deadline: "2026-09-26"
  revisit_when: "csat_score credible-interval lower bound below +2 at the 2026-Q4 review"
  replay:
    metric: csat_score
    ci_lower_min: 2.0
    on_pass: ship
    on_fail: hold

metrics:
  - name: csat_score
    type: average
    definition: "Post-contact satisfaction score on a 0-100 scale"
    grain: contact
    timezone: UTC
    source: support_marts.fct_csat
    owner: support-analytics

data:
  - name: csat
    source: support_marts.fct_csat
    period: "2026-07-01..2026-07-14"
    rows: 18240
    snapshot_at: "2026-07-16T03:00:00Z"
    known_gaps: "Unrated contacts excluded upstream. No outages in window."

design:
  kind: experiment
  identification: randomized_experiment
  randomization_unit: contact
  analysis_unit: contact
  arms: [control, treatment]
  expected_allocation: [0.5, 0.5]
  baseline_rate: 0.34
  mde: 0.02
  alpha: 0.05
  power: 0.80
  planned_n_per_arm: 10500
  duration_days: 14
  guardrail_metrics: [csat_score]
  peeking_policy: fixed_horizon

analysis:
  outcome_type: continuous
  n_groups: 2
  paired: false
  n_per_group: 10600
  normality_ok: true
  equal_variance: true
  independence_ok: true

results:
  observed_n: [10600, 10570]
  interim_looks: 1
  comparisons_looked_at: 1
  overall_effect: 4.1
  tests:
    - metric: csat_score
      effect: 4.1
      ci: [2.6, 5.6]
      posterior_probability: 0.994
      interpretation: "Posterior mass above the +2 floor is 0.99; the credible interval clears it."
      minimum_practical_effect: 2.0

claims:
  - text: >
      The redesigned support flow raises the post-contact satisfaction score by
      4.1 points (credible interval 2.6 to 5.6) in the test window.
    type: causal
    evidence: "examples/good-corpus/bayes-continuous-nps-NARRATIVE.md"
    population: "Rated support contacts, 2026-07-01 to 2026-07-14"
    identification: randomized_experiment

assumptions:
  - assumption: "Assignment is stable for a given contact across the interaction."
    rationale: "Bucketing is hashed on contact_id and persisted server-side."
    impact_if_wrong: "Cross-arm contamination would bias the posterior toward the null."
    checked: true

limitations:
  - "Measures rated contacts only; unrated contacts may differ systematically."
  - "The posterior is conditional on the priors declared below."

reproducibility:
  entrypoint: examples/good-corpus/_control_readout.py
  random_seed: 42
  language_version: "python 3.12.10"
  package_versions: "numpy 2.1.0, pymc 5.16.2"
  runs_clean_top_to_bottom: true
  repro_lock:
    schema_version: "1"
    stochasticity_declaration: >
      Posterior draws depend on the random seed and library versions recorded
      here; this lock documents configuration, not byte-identical replay.
    dsx_version: "2.0.0"

narrative:
  path: examples/good-corpus/bayes-continuous-nps-NARRATIVE.md
  audience: executive
  lead_claim: 0

validity_frame:
  estimand:
    quantity: "difference in post-contact satisfaction score"
    type: difference_in_means
    population: "rated support contacts, 2026-07-01 to 2026-07-14"
    contrast: "redesigned support flow vs current flow"
    time_window: "per contact"
    falsifier: "credible interval on the uplift includes zero, or its lower bound sits below +2"

  units:
    observation: contact
    assignment: contact
    analysis: contact

  identification:
    strength: strong
    evidence: "Assignment is hashed on contact_id and persisted server-side; see design.identification"
    constraint_source: none
    constraint_justification: ""

  dependence:
    structure: none
    cluster_var: ""

  interference:
    risk: none
    mechanism: ""
    mitigation: none
    residual_note: ""

  triggering:
    eligible_population: "all rated contacts in the test window"
    triggered_definition: "left a satisfaction rating"
    analysis_population: eligible
    expected_trigger_rate: 1.0
    dilution_adjusted: true

  stability:
    window: "14 days"
    novelty_primacy_assessed: true
    evidence: "internal readout; the satisfaction gap held flat after day 3"

  sampling_frame:
    source: "support_marts.fct_csat, no region filter"
    claim_population: "all rated contacts in the test window"
    known_exclusions: ["unrated contacts"]
    selection_risk: "none identified"

  missingness:
    mechanism: MAR
    rate: 0.0
    method_implied: multiple_imputation

  measurement:
    construct: "customer satisfaction"
    operationalisation: "post-contact satisfaction score on a 0-100 scale"
    known_gaps: "none identified"

inference:
  paradigm: bayesian
  paradigm_justification: decision_theoretic_loss_specified
  prior_justification: >
    Weakly-informative Normal priors on each arm's mean satisfaction, centred on
    the historical level; a wider-variance sensitivity check did not move the
    decision.
  threshold_calibration: >
    The P(uplift > +2) >= 0.95 rule was fixed before data collection and
    calibrated against the +2 practical floor.
  declared_at: pre_data
  primary_procedure: bayesian_normal_difference
  decision_threshold: 0.95
  fallback_rule: >
    If either arm's observed n falls below 80% of planned_n_per_arm, extend to
    the pre-declared duration_days ceiling before summarising the posterior.
