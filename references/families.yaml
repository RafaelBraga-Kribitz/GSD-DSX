# references/families.yaml -- the frequentist estimator ontology.
#
# This file is data. It is read by dsx/frame/admissibility.py and by nothing
# else in this repository. Its only parser is dsx.loader.load() -- no new
# parser may be added to read it (REQ-P11-01).
#
# Schema rules (D-06, D-07, D-08), one line each:
# - Two-space indentation; every sequence below is a block sequence of flat mappings.
# - Every string value is a double-quoted single-line scalar -- no "|", no ">", no unquoted free text.
# - No document-marker line, no anchor, no alias reference and no merge-key line anywhere in this file.
# - The inference-method axis key is the flat "inference_method:" -- no key here is a dotted path beginning "inference." and no key is named "paradigm" (D-07).
# - No value contains an unescaped space-then-hash sequence -- dsx.loader's bundled fallback parser and PyYAML diverge on that construct inside block scalars, and this file avoids the whole hazard by never using a block scalar (D-08).
#
# "assumption_vocabulary"'s closure is this project's editorial judgement, not
# a published finding: research established, negatively, that the Statistical
# Methods Ontology (STATO) advertises coverage of "conditions of application"
# and delivers zero classes labelled "assumption" across 109 properties, and
# that no ontology in the Open Biological and Biomedical Ontologies (OBO)
# Foundry has one either. No published taxonomy of estimator assumptions
# exists. The vocabulary below is assembled instead from six named source
# clusters, each token carrying its own citation (D-10, D-11).
vocabulary_is_not_exhaustive: true

# Per-family "buys" and "charges" (used starting at the families: block below):
# "charges" names the assumption tokens a family requires the analyst to
# maintain; "buys" names the tokens a family removes the need to maintain,
# relative to a plainer alternative in the same (estimand, dependence) group.
# Both are plain sequences of tokens defined once here, in assumption_vocabulary,
# and never re-cited per family.
#
# locator_status rule for every citation in this file: "verified" means every
# locator that actually appears in the citation string has been confirmed
# against the source. "unverified" means at least one has not, and "notes"
# names which. A citation carrying no in-paper locator at all is "verified"
# when its article-level identifiers (author, year, venue, DOI/arXiv) are
# confirmed (D-09).

assumption_vocabulary:
  - token: "exchangeability"
    citation: "Hernan, M.A. and Robins, J.M. (2020), Causal Inference: What If, Chapter 3, section 3.2"
    locator_status: "verified"
    notes: "The no-unmeasured-confounding assumption every comparison in this file relies on."
  - token: "positivity"
    citation: "Hernan, M.A. and Robins, J.M. (2020), Causal Inference: What If, Chapter 3, section 3.3"
    locator_status: "verified"
    notes: "Every unit has nonzero probability of receiving either treatment level actually compared."
  - token: "consistency_of_treatment_versions"
    citation: "Hernan, M.A. and Robins, J.M. (2020), Causal Inference: What If, Chapter 3, section 3.4"
    locator_status: "verified"
    notes: "The treatment as declared and the treatment as delivered are the same well-defined intervention."
  - token: "no_interference_between_units"
    citation: "Rubin, D.B. (1980), Journal of the American Statistical Association 75(371):591-593"
    locator_status: "verified"
    notes: "SUTVA's no-interference half -- one unit's outcome does not depend on another unit's assigned treatment."
  - token: "single_version_of_treatment"
    citation: "Imbens, G.W. and Rubin, D.B., Causal Inference for Statistics, Social, and Biomedical Sciences, Chapter 1, section 1.6"
    locator_status: "verified"
