# S3-3 MEASUREMENT-SPIKE fixture (Phase 27, REQ-P27-01/02/03; D-13 measured-first).
# NOT a committed corpus fixture — it lives under the phase dir as a measurement
# input only. Its non-model blocks (decision/metrics/data/design/analysis/claims/
# validity_frame/inference) are cloned wholesale from the measured-passing sibling
# examples/known-bad/full-frame-cleaning-ANALYSIS-SPEC.yaml so this fixture's
# incidental corpus-gap profile matches a known baseline and the ONLY new property
# under test is feature origin.
#
# The encoded defect (D-27-01, FROZEN in 27-CONTEXT.md): the churn model uses an
# innocuously-named feature `account_health_index` that is recomputed nightly from
# activity INCLUDING the outcome window, so its training-time value is not the value
# that would exist at the declared prediction moment. Every declaration is honest —
# temporal split with disjoint declared periods, preprocessing_fit_on: train_only,
# a complete selection_ledger, a beaten baseline, honest train AND test scores,
# declared calibration — and the paired entrypoint has NO code defect (no full-frame
# cleaning, no scaler-before-split, no test-sees-target idiom). The defect is
# attributable ONLY through feature origin, invisible to a name-pattern-plus-
# declaration gate. `account_health_index` matches NONE of the 10 LEAKAGE_PATTERNS.
#
# Predicted (NOT a substitute for measurement): a live miss. The measurement script
# feature-origin-leak-MEASURE.py records the verbatim four-point verdict.

spec_version: 1
title: "Does a personalized retention outreach reduce churn among customers flagged by a churn-risk model, compared across five candidate campaign designs?"
spec_id: "feature-origin-leak"
owner: "retention-analytics"
created: "2026-09-07"

question_type: causal

decision:
  owner: "VP Retention"
  decision_rule: >
    Roll out the winning outreach campaign design to 100% of flagged at-risk
    customers if its 95% CI lower bound on the churn-rate reduction, after a
    Holm correction across the comparison family, exceeds +1.0pp. Otherwise
    hold at the current retention process.
  action_if_null: "Keep the current retention process; close the initiative and reallocate the squad."
  minimum_practical_effect: 0.02
  reversible: true
  deadline: "2026-08-15"
  revisit_when: "churn_rate reduction below +1.0pp at the 2026-Q4 review"

metrics:
  - name: churn_rate
    type: ratio
    definition: "Share of flagged at-risk customers who churned within the observation window"
    grain: customer
    numerator: "count(distinct customer_id) where churned_at is not null"
    denominator: "count(distinct customer_id) where flagged_at_risk_at is not null"
    source: warehouse.fct_customer_churn
    owner: retention-analytics

data:
  - name: flagged_customers
    source: warehouse.fct_customer_churn
    period: "2026-07-01..2026-07-21"
    rows: 63104

design:
  kind: experiment
  identification: randomized_experiment
  randomization_unit: customer
  analysis_unit: customer
  arms: [control, treatment]
  expected_allocation: [0.5, 0.5]
  baseline_rate: 0.24
  mde: 0.02
  alpha: 0.05
  power: 0.80
  planned_n_per_arm: 7400
  duration_days: 21
  peeking_policy: fixed_horizon

analysis:
  outcome_type: proportion
  n_groups: 2
  paired: false
  n_per_group: 7462
  test: two_proportion_z
  normality_ok: true
  equal_variance: true
  independence_ok: true

# ── Model ────────────────────────────────────────────────────────────────────
# The churn-risk model that flags the at-risk population the experiment above
# draws its arms from. Every field below is honest. The split is temporal with
# disjoint declared windows; preprocessing is fitted on the training fold only;
# the selection ledger is complete; the baseline is beaten; train and test scores
# are both reported honestly (a uniform leak inflates them symmetrically, so the
# gap stays inside tolerance); calibration is declared. NONE of these fields, and
# no check on the gate path, can see that `account_health_index` is recomputed
# nightly from activity that includes the outcome window — the defect this fixture
# exists to measure as a miss.
model:
  task: binary_classification
  target: churned_90d
  algorithm: gradient_boosting
  split: temporal
  time_column: as_of_date
  train_period: "2025-01-01..2025-09-30"
  test_period: "2025-10-01..2025-12-31"
  features:
    - tenure_days
    - plan_tier
    - monthly_charges
    - support_ticket_count
    - num_logins_30d
    - account_health_index
    - region
  prediction_time_definition: "Scored nightly at 02:00 for every active account; the churn-risk score selects the flagged at-risk population for the retention-outreach experiment above."
  positive_rate: 0.18
  preprocessing_fit_on: train_only
  primary_metric: pr_auc
  baseline: majority_class
  uses_predicted_probabilities: true
  calibration_method: isotonic
  selection_ledger:
    candidates_evaluated: 3
    configurations_tried: 24
    selected_on: validation

reproducibility:
  entrypoint: feature-origin-leak-entrypoint.py
  random_seed: 42

results:
  observed_n: [7462, 7431]
  interim_looks: 1
  overall_effect: 0.021
  model_score: 0.42
  baseline_score: 0.18
  model_score_source: holdout
  fold_scores: [0.40, 0.42, 0.44]
  train_score: 0.45
  test_score: 0.42
  positive_rate: 0.18
  calibration_error: 0.03

claims:
  - text: >
      The fifth candidate retention-outreach campaign design decreases churn
      rate by 2.1 percentage points among flagged at-risk customers in the
      test window.
    type: causal
    evidence: "RESULTS.md#retention-campaign-uplift"
    population: "Flagged at-risk customers, 2026-07-01 to 2026-07-21"
    identification: randomized_experiment

assumptions:
  - assumption: "Bucketing is stable across a customer for a given customer_id."
    rationale: "Assignment is hashed on customer_id and persisted server-side."
    impact_if_wrong: "Contamination between arms would bias the estimate toward zero."
    checked: false

limitations:
  - "The churn-risk model flagging the at-risk population for this experiment carries its own encoded defect; see model: above and the paired measurement record."

validity_frame:
  estimand:
    quantity: "difference in churn rate"
    type: difference_in_proportions
    population: "flagged at-risk customers, 2026-07-01 to 2026-07-21"
    contrast: "fifth candidate retention-outreach campaign design (treatment) vs current retention process (control)"
    time_window: "within-customer, 2026-07-01 to 2026-07-21"
    falsifier: "the Holm-corrected 95% CI on the churn-rate reduction includes zero, or its lower bound sits below +1.0pp"

  units:
    observation: customer
    assignment: customer
    analysis: customer

  identification:
    strength: strong
    evidence: "Assignment is randomized per customer at flagging time and persisted server-side."
    constraint_source: none
    constraint_justification: ""

  dependence:
    structure: none
    cluster_var: ""
    method_family_required: ""

  interference:
    risk: none
    mechanism: ""
    mitigation: none
    residual_note: ""

  triggering:
    eligible_population: "all customers flagged at-risk in the window"
    triggered_definition: "received the outreach campaign"
    analysis_population: eligible
    expected_trigger_rate: 1.0
    dilution_adjusted: false

  stability:
    window: "21 days"
    novelty_primacy_assessed: true
    evidence: "RESULTS.md#retention-campaign-stability"

  sampling_frame:
    source: "warehouse.fct_customer_churn, all regions"
    claim_population: "all customers flagged at-risk in the window"
    known_exclusions: []
    selection_risk: "none identified"

  missingness:
    mechanism: not_assessed
    rate: 0.0
    method_implied: complete_case

  measurement:
    construct: "customer churn"
    operationalisation: "an account closure or cancellation recorded within the observation window"
    known_gaps: "none identified"

inference:
  paradigm: frequentist
  paradigm_justification: team_convention
  declared_at: pre_data
  primary_procedure: two_proportion_z
  alpha_spending: null
  fallback_rule: "No mid-study procedure switch was declared or performed; the single pre-registered two-proportion z-test was run as declared."
