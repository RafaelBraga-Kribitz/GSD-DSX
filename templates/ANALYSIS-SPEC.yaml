# ANALYSIS-SPEC — the analysis contract.
#
# This file is the deterministic input the whole capability turns on. Agents fill
# it using judgement; `dsx` checks it using arithmetic. Every gate in the GSD loop
# reads this file, so a field left blank is not a formatting oversight — it is a
# decision that has not been made yet.
#
# Fill it BEFORE touching data. Fields under `results:` are filled during execute.
#
# Validate at any time:   dsx validate
# Full audit:             dsx audit --verbose
# Vocabularies:           dsx vocab

spec_version: 1
title: "<one line: the decision this analysis exists to support>"
owner: "<analyst>"
created: "<YYYY-MM-DD>"

# ── What kind of question is this? ───────────────────────────────────────────
# descriptive  — what happened (no inference beyond the sample)
# diagnostic   — why it happened (decomposition within observed data)
# predictive   — what will happen (out-of-sample performance is the claim)
# causal       — what is the effect of X on Y (needs an identification strategy)
# prescriptive — what should we do (needs a causal estimate plus a decision rule)
question_type: descriptive

# ── The decision ─────────────────────────────────────────────────────────────
# Written before results exist. This is the primary defence against reading the
# answer out of the data after the fact.
decision:
  owner: "<who acts on this>"
  decision_rule: >
    <If X then we do A, otherwise B. State the threshold and the interval,
    not just the direction.>
  action_if_null: "<what happens when no effect is detected>"
  minimum_practical_effect: null   # smallest effect that would change the decision
  reversible: true
  deadline: "<YYYY-MM-DD or null>"
  # Structured replay — evaluated against results.tests at verify/ship (not NLP).
  # Required at ship when design.kind=experiment (or causal/prescriptive) with tests.
  # replay:
  #   metric: activation_rate
  #   ci_lower_min: 0.01
  #   # ci_upper_max: null
  #   # effect_min: null
  #   on_pass: rollout
  #   on_fail: hold

# ── Metrics ──────────────────────────────────────────────────────────────────
# One name, one definition. Ratios must declare both numerator and denominator —
# most metric disputes are denominator disputes.
metrics:
  - name: <snake_case_name>
    type: ratio                    # ratio | count | sum | average | rate | percentile | index
    definition: "<computable expression, not a label>"
    grain: <user | session | order | account | day>
    numerator: "<expression including filters>"
    denominator: "<expression including filters>"
    timezone: UTC
    source: <warehouse.table>
    owner: <team>
    # sql: |
    #   SELECT ...            # optional; linted for fan-out and NULL semantics
    # reconciliation:
    #   class: default           # financial | user | behavioral | default
    #   tolerance: 0.01          # overrides class default when set
    #   sources:
    #     - { name: warehouse, value: 12345 }
    #     - { name: product_analytics, value: 12290 }

# ── Data ─────────────────────────────────────────────────────────────────────
# Prefer `dsx profile path.csv --out DATA-PROFILE.yaml` for local extracts.
# Gates compare assertions to the profile artifact — they never open the warehouse.
data:
  - name: <dataset name>
    source: <table, path or endpoint>
    period: "<YYYY-MM-DD..YYYY-MM-DD>"
    rows: null
    snapshot_at: null              # or hash: "sha256:..."
    profile_path: DATA-PROFILE.yaml
    assertions:
      row_count: { equals: null, min: null, max: null, tol: 0.01 }
      primary_key: []              # columns that must be unique in the profile
      max_null_rate: {}            # column: max allowed null fraction, e.g. user_id: 0.0
      time_column: null
      max_gap_days: null
      banned_sentinels: []         # values that must not appear, e.g. [-1, 999, "1900-01-01"]
    known_gaps: "<outages, backfills, filters applied upstream>"

# ── Design ───────────────────────────────────────────────────────────────────
# Required for causal and prescriptive questions. Delete for pure descriptive work.
design:
  kind: observational              # experiment | quasi_experiment | observational | timeseries | none
  identification: none             # see `dsx vocab` for the closed list

  # --- experiment only ---
  randomization_unit: null
  analysis_unit: null
  variance_adjustment: null        # required when the two units differ
  arms: []
  expected_allocation: []
  baseline_rate: null              # proportion, e.g. 0.31
  mde: null                        # absolute, e.g. 0.02 == 2 percentage points
  alpha: 0.05
  power: 0.80
  planned_n_per_arm: null          # dsx computes what this must be and blocks if short
  duration_days: null
  guardrail_metrics: []
  peeking_policy: fixed_horizon    # fixed_horizon | sequential_obf | sequential_pocock | always_valid | uncontrolled_continuous

  multiplicity:
    family: []                     # every metric being tested
    correction: none               # bonferroni | holm | benjamini_hochberg | none

  # --- quasi-experimental strategies declare their own assumptions ---
  # parallel_trends_evidence: "<for difference_in_differences>"
  # instrument: "<for instrumental_variable>"
  # exclusion_restriction_argument: "<for instrumental_variable>"
  # running_variable: / cutoff:      "<for regression_discontinuity>"
  # covariates: / sensitivity_analysis: "<for matching or regression_adjustment>"

# ── Analysis method ──────────────────────────────────────────────────────────
# dsx derives the correct test from these and blocks if `test` disagrees.
analysis:
  outcome_type: proportion         # proportion | continuous | count | ordinal | time_to_event
  n_groups: 2
  paired: false
  n_per_group: null
  test: null                       # `dsx recommend-test proportion --groups 2` to derive
  normality_ok: null               # true | false — record the diagnostic used
  equal_variance: null
  independence_ok: null            # the one assumption sample size cannot rescue

# ── Model ────────────────────────────────────────────────────────────────────
# Predictive work only. Delete otherwise.
# model:
#   task: binary_classification
#   target: <column>
#   algorithm: <e.g. gradient_boosting>
#   split: temporal                     # random | stratified | temporal | grouped | grouped_temporal | nested_cv
#   time_column: <column>
#   entity_column: <column>             # set when entities repeat across rows
#   train_period: "YYYY-MM-DD..YYYY-MM-DD"
#   test_period:  "YYYY-MM-DD..YYYY-MM-DD"
#   prediction_time_definition: "<when the model runs in production>"
#   features: []
#   features_excluded_for_leakage: []
#   preprocessing_fit_on: train_only
#   resampling_applied_to: train_only
#   primary_metric: pr_auc
#   secondary_metrics: []
#   baseline: majority_class
#   positive_rate: null
#   threshold_selected_on: validation
#   calibration_method: null

# ── Visuals ──────────────────────────────────────────────────────────────────
# Declare the argument each chart makes; dsx checks the encoding supports it.
visuals:
  - name: <chart name>
    chart_id: <stable_id>              # unique across visuals; used by FIGURE-MANIFEST
    relationship: comparison           # `dsx vocab` for the closed list
    type: bar
    data_input_type: categorical-value # `dsx vocab` — must admit `type`
    renderer: matplotlib               # matplotlib | plotly | altair | ggplot | glyph | other
    artifact_path: figures/<name>.svg  # on-disk figure; seal with `dsx seal`
    svg_sha256: null                   # "sha256:..." — required at ship when artifact_path set
    generator: analysis/charts.py
    run_id: null                       # shared across visuals from the same readout
    expected_categories: []            # for smell J vs category_count
    series_role: component             # component | scenario — never stack scenarios
    encodings: { x: null, y: null, color: null }
    # within_group_std: null           # set 0 to flag dead/broadcast series (smell B)
    # atomicity: false                 # true when y has few discrete atoms (smell G)
    # n_unique: null
    # ratio_of_x: false                # true when y algebraically contains x (smell K)
    y_axis_starts_at_zero: true
    dual_axis: false
    units: "<%, USD, count>"
    takeaway: "<the sentence you want remembered — not 'Revenue by region'>"
    category_order: by_value
    category_count: null
    color_count: null
    palette: null
    shows_estimates: false
    shows_uncertainty: false
    source: "<dataset, period>"

# ── Reproducibility ──────────────────────────────────────────────────────────
reproducibility:
  entrypoint: <analysis.py or notebook.ipynb>
  random_seed: 42
  language_version: "<python 3.12>"
  lockfile: <requirements.txt | uv.lock | environment.yml>
  package_versions: null
  runs_clean_top_to_bottom: false  # notebooks only; set true after Restart & Run All
  # Required key when results.tests is non-empty (verify/ship). null = honest opt-out.
  repro_lock:
    schema_version: "1"
    stochasticity_declaration: >
      Analysis outputs depend on data extracts and library versions recorded
      elsewhere in this block; this lock documents configuration, not byte-identical replay.
    dsx_version: "1.4.0"
    # entrypoint_sha256: "sha256:…"
    # results_fingerprint: "sha256:…"
  # OR: repro_lock: null

# ── Results ──────────────────────────────────────────────────────────────────
# Filled during execute. Leave as-is while planning.
results:
  observed_n: []                   # per arm — drives the SRM test
  interim_looks: null              # every time someone looked at the outcome
  comparisons_looked_at: null      # incl. exploratory cuts; vs multiplicity.family
  positive_rate: null
  overall_effect: null
  segments: []                     # [{ name, effect, n }] — drives Simpson's check
  train_score: null
  test_score: null
  model_score: null
  baseline_score: null
  test_set_evaluations: null
  train_test_overlap_rows: null
  period_comparisons: []
  tests: []
    # - metric: <name>
    #   p_value: 0.031
    #   effect: 0.021                     # in the metric's own units
    #   standardized_effect: 0.045
    #   effect_size_kind: h               # d | h | r
    #   ci: [0.002, 0.040]
    #   interpretation: "<one sentence>"
    #   minimum_practical_effect: 0.01
    #   equivalence_bound: null           # ±bound for TOST / CI-in-bounds
    #   detectable_mde: null              # smallest effect the study could detect
    #   tost: { lower_p: null, upper_p: null }

# ── Narrative deliverable ────────────────────────────────────────────────────
# Required at ship when claims[] is non-empty. Every claim text must appear
# verbatim (whitespace-normalised) in this file.
narrative:
  path: NARRATIVE.md
  audience: executive              # executive | product | technical
  lead_claim: 0

# Optional BI surface — if declared, path must exist at ship.
# dashboard:
#   path: dashboard/README.md
#   tools: []

# ── Claims ───────────────────────────────────────────────────────────────────
# Every headline statement the deliverable will make. dsx reads the wording and
# holds it to the evidence declared above.
claims:
  - text: "<the claim exactly as it will appear>"
    type: descriptive              # descriptive | association | predictive | causal
    evidence: "RESULTS.md#anchor"
    population: "<who this applies to>"
    # ci: [lower, upper]
    # identification: <overrides design.identification for this claim>
    # base_n: null                 # absolute base when text has a relative %
    # from_value: null             # optional pair for "up X% from A to B"
    # to_value: null

# ── Assumptions and limitations ──────────────────────────────────────────────
assumptions:
  - assumption: "<what we are taking as true>"
    rationale: "<why>"
    impact_if_wrong: "<what breaks>"
    checked: false
    # waiver: "Not testable: …"   # at ship: checked:true XOR non-blank waiver

limitations:
  - "<what this analysis cannot tell you, stated plainly>"
  # Required non-empty at verify/ship when question_type is causal|prescriptive|predictive

# ── Validity frame (REQ-P6-02) ───────────────────────────────────────────────
# estimand, units, measurement, dependence, sampling_frame and missingness are
# required for every question_type. identification, interference, triggering
# and stability are additionally required when question_type is causal or
# prescriptive, or when design.kind above is experiment. `dsx vocab` lists
# every closed vocabulary referenced below.
validity_frame:
  estimand:
    quantity: "<the difference, rate or quantity being estimated>"
    population: "<who this covers>"
    contrast: "<treatment vs control, or before vs after>"
    time_window: "<the window over which the effect is measured>"
    falsifier: "<the observation that would prove this wrong>"

  units:
    observation: "<the finest-grained row in the source data>"
    assignment: "<the unit treatment/exposure is assigned at>"
    analysis: "<the unit the analysis is run at>"

  identification:
    strength: weak                 # strong | moderate | weak
    evidence: "<why this strength, e.g. randomisation or a VIF check>"
    constraint_source: none        # none | informative_priors | penalisation | design_restriction | hierarchical_pooling
    constraint_justification: "<required unless constraint_source is none>"

  dependence:
    structure: none                # none | clustered | repeated_measures | temporal | spatial | hierarchical
    cluster_var: null
    method_family_required: null   # cluster_robust | delta_method | bootstrap_cluster | mixed_effects

  interference:
    risk: none                     # none | shared_budget | marketplace | geo_spillover | social_graph | shared_inventory
    mechanism: "<required unless risk is none>"
    mitigation: none               # none | geo_split | cluster_randomisation | time_split | budget_isolation | modelled
    residual_note: "<what remains unaddressed, if anything>"

  triggering:
    eligible_population: "<who could have triggered the analysed event>"
    triggered_definition: "<the event that puts a unit in the analysis>"
    analysis_population: eligible  # eligible | triggered
    expected_trigger_rate: null
    dilution_adjusted: false

  stability:
    window: "<how long the effect was observed for>"
    novelty_primacy_assessed: false
    evidence: "<pointer to the check, e.g. RESULTS.md#week1-vs-week2>"

  sampling_frame:
    source: "<where the analysed rows come from>"
    claim_population: "<the population the claim will be made about>"
    known_exclusions: []
    selection_risk: "<how the sample could differ systematically from the claim population>"

  missingness:
    mechanism: not_assessed        # MCAR | MAR | MNAR | not_assessed
    rate: null
    method_implied: "<how missing rows are handled, e.g. complete_case>"

  measurement:
    construct: "<the concept being measured>"
    operationalisation: "<the exact rule that turns the construct into a number>"
    known_gaps: "<what the measurement misses>"

# ── Inference plan (REQ-P6-04) ───────────────────────────────────────────────
# Declared before results exist, same discipline as decision: above. The
# stopping-rule concept lives in design.peeking_policy above, not here (M-02).
inference:
  paradigm: frequentist            # frequentist | bayesian
  paradigm_justification: team_convention
    # prior_information_available | sequential_monitoring_required
    # decision_theoretic_loss_specified | small_sample_informative_prior
    # regulatory_requirement | team_convention | vendor_constraint
  declared_at: pre_data            # pre_data | post_data
  primary_procedure: "<the test or model that will be run, e.g. two_proportion_z>"
  alpha_spending: null
  fallback_rule: "<what happens if an assumption fails, e.g. switch to a bootstrap>"

# ── Suppressions (optional) ──────────────────────────────────────────────────
# ADR/SPEC-backed waivers for known HIGH/CRITICAL findings. Each row removes
# matching findings from the blocking set after checks run. Unknown codes abort
# the run (exit 2). Prefer fixing the defect; suppress only when a written
# authority forbids the preferred fix.
#
# suppressions:
#   - code: DSX-VIZ-030
#     chart_id: a3_realized_vol      # optional: scope to one visual
#     reason: "AN-301 requires twin axes; change needs ADR"
#     authority: "docs/SPEC-04_analytics.md"
